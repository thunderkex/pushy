[package]
name = "pushy"
version = "0.1.0"
edition = "2021"
description = "Simple, zero-config file uploader with automatic fallback"

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "stream", "rustls-tls", "json"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
indicatif = "0.18"
anyhow = "1.0"
dirs = "6.0"
dialoguer = "0.12"
arboard = { version = "3.4", optional = true }
futures-util = "0.3"
tempfile = "3.17"
shlex = "1.3"
ua_generator = { version = "0.5", default-features = false }

[dev-dependencies]
wiremock = "0.6"
