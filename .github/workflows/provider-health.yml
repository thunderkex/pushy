name: Provider Health Check

on:
  schedule:
    - cron: '0 0 * * 1' # At 00:00 on Monday.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-providers:
    name: Test Providers & Update Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install curl and jq
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq

      - name: Run provider probe test
        run: |
          chmod +x scripts/test_providers.sh
          ./scripts/test_providers.sh

      - name: Commit and push report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/PROVIDER_STATUS.md
          if git diff --staged --quiet; then
            echo "No changes in provider health status."
          else
            git commit -m "docs: update provider status report [skip ci]"
            git push
          fi
